name: Multi-OS Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to publish/update (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Download libmpv runtime DLL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path mpv-dl
          try {
            gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-*.7z" --dir mpv-dl
            $archive = (Get-ChildItem mpv-dl\*.7z | Select-Object -First 1).FullName
            7z e $archive -o.\ "libmpv-2.dll" -r -y
          } catch {
            Write-Warning "Could not fetch libmpv from shinchiro releases, continuing..."
          }

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win\VortexPlayer-windows-x64
          Copy-Item "target/x86_64-pc-windows-msvc/release/vortex-player-egui.exe" "dist-win/VortexPlayer-windows-x64/" -Force
          Copy-Item "README.md" "dist-win/VortexPlayer-windows-x64/" -Force
          Copy-Item "LICENSE" "dist-win/VortexPlayer-windows-x64/" -Force
          if (Test-Path "libmpv-2.dll") {
            Copy-Item "libmpv-2.dll" "dist-win/VortexPlayer-windows-x64/" -Force
          }
          if (Test-Path "MediaInfo.exe") {
            Copy-Item "MediaInfo.exe" "dist-win/VortexPlayer-windows-x64/" -Force
          }
          
          # Standalone EXE
          Copy-Item "target/x86_64-pc-windows-msvc/release/vortex-player-egui.exe" "dist-win/vortex-player-windows-x64.exe" -Force
          
          # Portable ZIP
          Compress-Archive -Path "dist-win/VortexPlayer-windows-x64/*" -DestinationPath "dist-win/VortexPlayer-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist-win/*.zip
            dist-win/*.exe

  build-linux:
    name: Linux x86_64 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist-linux/vortex-player-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/vortex-player-egui dist-linux/vortex-player-linux-x86_64/
          cp README.md LICENSE dist-linux/vortex-player-linux-x86_64/
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png dist-linux/vortex-player-linux-x86_64/vortex-player.png
          fi
          if [ -f "assets/vortex-player.desktop" ]; then
            cp assets/vortex-player.desktop dist-linux/vortex-player-linux-x86_64/
          fi
          chmod +x dist-linux/vortex-player-linux-x86_64/vortex-player-egui
          
          cd dist-linux
          tar -czf VortexPlayer-linux-x86_64.tar.gz vortex-player-linux-x86_64
          sha256sum VortexPlayer-linux-x86_64.tar.gz > VortexPlayer-linux-x86_64.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist-linux/*.tar.gz
            dist-linux/*.sha256

  build-macos-arm64:
    name: macOS Apple Silicon Build
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package macOS Apple Silicon Artifacts
        run: |
          mkdir -p dist-macos-arm64/vortex-player-macos-arm64
          cp target/aarch64-apple-darwin/release/vortex-player-egui dist-macos-arm64/vortex-player-macos-arm64/
          cp README.md LICENSE dist-macos-arm64/vortex-player-macos-arm64/
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png dist-macos-arm64/vortex-player-macos-arm64/
          fi
          chmod +x dist-macos-arm64/vortex-player-macos-arm64/vortex-player-egui
          
          cd dist-macos-arm64
          tar -czf VortexPlayer-macos-arm64.tar.gz vortex-player-macos-arm64
          shasum -a 256 VortexPlayer-macos-arm64.tar.gz > VortexPlayer-macos-arm64.tar.gz.sha256

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist-macos-arm64/*.tar.gz
            dist-macos-arm64/*.sha256

  build-macos-x86_64:
    name: macOS Intel Build
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Release Binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package macOS Intel Artifacts
        run: |
          mkdir -p dist-macos-x64/vortex-player-macos-x86_64
          cp target/x86_64-apple-darwin/release/vortex-player-egui dist-macos-x64/vortex-player-macos-x86_64/
          cp README.md LICENSE dist-macos-x64/vortex-player-macos-x86_64/
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png dist-macos-x64/vortex-player-macos-x86_64/
          fi
          chmod +x dist-macos-x64/vortex-player-macos-x86_64/vortex-player-egui
          
          cd dist-macos-x64
          tar -czf VortexPlayer-macos-x86_64.tar.gz vortex-player-macos-x86_64
          shasum -a 256 VortexPlayer-macos-x86_64.tar.gz > VortexPlayer-macos-x86_64.tar.gz.sha256

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            dist-macos-x64/*.tar.gz
            dist-macos-x64/*.sha256

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Inspect Packages
        run: |
          ls -la release-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          files: release-packages/*
          overwrite: true
          draft: false
          prerelease: false
