name: Multi-OS & Multi-Arch Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to publish/update (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Download libmpv runtime DLL (x64)
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path mpv-dl
          try {
            curl.exe -sLo mpv-dl\mpv.7z "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261001/mpv-dev-x86_64-20261001-git-3186d369f9.7z"
            7z e mpv-dl\mpv.7z -o.\ "libmpv-2.dll" -r -y
          } catch {
            Write-Warning "Optional libmpv fetch failed, continuing with standalone binary..."
          }

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $pkgDir = "dist-win/VortexPlayer-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $pkgDir
          Copy-Item "target/${{ matrix.target }}/release/vortex-player-egui.exe" "$pkgDir/" -Force
          Copy-Item "README.md" "$pkgDir/" -Force
          Copy-Item "LICENSE" "$pkgDir/" -Force
          if (Test-Path "libmpv-2.dll") {
            Copy-Item "libmpv-2.dll" "$pkgDir/" -Force
          }
          
          # Standalone binary
          Copy-Item "target/${{ matrix.target }}/release/vortex-player-egui.exe" "dist-win/vortex-player-windows-${{ matrix.arch }}.exe" -Force
          
          # Portable ZIP
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist-win/VortexPlayer-windows-${{ matrix.arch }}.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist-win/*.zip
            dist-win/*.exe

  build-linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist-linux/vortex-player-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/vortex-player-egui dist-linux/vortex-player-linux-x86_64/
          cp README.md LICENSE dist-linux/vortex-player-linux-x86_64/
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png dist-linux/vortex-player-linux-x86_64/vortex-player.png
          fi
          if [ -f "assets/vortex-player.desktop" ]; then
            cp assets/vortex-player.desktop dist-linux/vortex-player-linux-x86_64/
          fi
          chmod +x dist-linux/vortex-player-linux-x86_64/vortex-player-egui
          
          cd dist-linux
          tar -czf VortexPlayer-linux-x86_64.tar.gz vortex-player-linux-x86_64
          sha256sum VortexPlayer-linux-x86_64.tar.gz > VortexPlayer-linux-x86_64.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist-linux/*.tar.gz
            dist-linux/*.sha256

  build-linux-cross:
    name: Linux Cross (${{ matrix.arch_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu
            arch_name: arm64
          - target: riscv64gc-unknown-linux-gnu
            zig_target: riscv64gc-unknown-linux-gnu
            arch_name: riscv64
          - target: armv7-unknown-linux-gnueabihf
            zig_target: armv7-unknown-linux-gnueabihf
            arch_name: armv7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0

      - name: Patch Zig RISC-V libc assembler compatibility
        if: matrix.arch_name == 'riscv64'
        run: |
          ZIG_BIN=$(which zig)
          ZIG_DIR=$(dirname $(dirname "$ZIG_BIN"))
          echo "Patching Zig glibc files in $ZIG_DIR"
          sudo find "$ZIG_DIR" -type f -name "start-2.33.S" -exec sed -i 's/.*\.cfi_label.*/\/* .cfi_label *\//g' {} + 2>/dev/null || true
          sudo find "$ZIG_DIR" -type f -path "*/riscv/*" -name "*.S" -exec sed -i 's/.*\.cfi_label.*/\/* .cfi_label *\//g' {} + 2>/dev/null || true

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build Binary with zigbuild
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          cargo zigbuild --release --target ${{ matrix.zig_target }}

      - name: Package Cross Linux Artifacts
        run: |
          PKG_NAME="vortex-player-linux-${{ matrix.arch_name }}"
          mkdir -p "dist-cross/${PKG_NAME}"
          BIN_PATH="target/${{ matrix.zig_target }}/release/vortex-player-egui"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/vortex-player-egui"
          fi
          cp "$BIN_PATH" "dist-cross/${PKG_NAME}/vortex-player-egui"
          cp README.md LICENSE "dist-cross/${PKG_NAME}/"
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png "dist-cross/${PKG_NAME}/vortex-player.png"
          fi
          if [ -f "assets/vortex-player.desktop" ]; then
            cp assets/vortex-player.desktop "dist-cross/${PKG_NAME}/"
          fi
          chmod +x "dist-cross/${PKG_NAME}/vortex-player-egui"
          
          cd dist-cross
          tar -czf "VortexPlayer-linux-${{ matrix.arch_name }}.tar.gz" "${PKG_NAME}"
          sha256sum "VortexPlayer-linux-${{ matrix.arch_name }}.tar.gz" > "VortexPlayer-linux-${{ matrix.arch_name }}.tar.gz.sha256"

      - name: Upload Cross Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch_name }}
          path: |
            dist-cross/*.tar.gz
            dist-cross/*.sha256

  build-macos-arm64:
    name: macOS (Apple Silicon ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package macOS Apple Silicon Artifacts
        run: |
          mkdir -p dist-macos-arm64/vortex-player-macos-arm64
          cp target/aarch64-apple-darwin/release/vortex-player-egui dist-macos-arm64/vortex-player-macos-arm64/
          cp README.md LICENSE dist-macos-arm64/vortex-player-macos-arm64/
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png dist-macos-arm64/vortex-player-macos-arm64/
          fi
          chmod +x dist-macos-arm64/vortex-player-macos-arm64/vortex-player-egui
          
          cd dist-macos-arm64
          tar -czf VortexPlayer-macos-arm64.tar.gz vortex-player-macos-arm64
          shasum -a 256 VortexPlayer-macos-arm64.tar.gz > VortexPlayer-macos-arm64.tar.gz.sha256

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist-macos-arm64/*.tar.gz
            dist-macos-arm64/*.sha256

  build-macos-x86_64:
    name: macOS (Intel x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Release Binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package macOS Intel Artifacts
        run: |
          mkdir -p dist-macos-x64/vortex-player-macos-x86_64
          cp target/x86_64-apple-darwin/release/vortex-player-egui dist-macos-x64/vortex-player-macos-x86_64/
          cp README.md LICENSE dist-macos-x64/vortex-player-macos-x86_64/
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png dist-macos-x64/vortex-player-macos-x86_64/
          fi
          chmod +x dist-macos-x64/vortex-player-macos-x86_64/vortex-player-egui
          
          cd dist-macos-x64
          tar -czf VortexPlayer-macos-x86_64.tar.gz vortex-player-macos-x86_64
          shasum -a 256 VortexPlayer-macos-x86_64.tar.gz > VortexPlayer-macos-x86_64.tar.gz.sha256

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            dist-macos-x64/*.tar.gz
            dist-macos-x64/*.sha256

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux-x86_64, build-linux-cross, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Inspect Packages
        run: |
          ls -la release-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          files: release-packages/*
          overwrite_files: true
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
